  type: Documentation
  note: Institution identity facts (founding 1937, ~$56B assets, ~2.9M members, 275 branches, NCUA-insured, NMLS #430055). No API mention.
- url: https://www.ncsecu.org/services/online
  type: Documentation
  note: Digital banking / Member Access. Supports connecting external accounts for aggregation; no developer API, Plaid/Finicity/MX, or open-banking protocol named.
