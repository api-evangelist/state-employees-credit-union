actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No public first-party API surface, no downloadable specification, and no
    documented FDX/1033 data-access endpoint exist to harvest. The correct,
    non-fabricated result is an identity-only record with an empty apis[] block
    and an honest "no public API — aggregator-only" posture.
